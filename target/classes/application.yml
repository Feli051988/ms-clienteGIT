spring:
  application:
    name: ms-cliente

  datasource:
    url: jdbc:h2:mem:dbPrueba
    username: "sa"
    password: 
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true 
    properties:
      format_sql: true 

  jackson:
    mapper:
      sort-properties-alphabetically: false 

server:
  port: 9000